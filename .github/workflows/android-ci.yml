name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: |
          yes | sdkmanager "ndk;28.2.13676358" "cmake;3.31.6" "platforms;android-36"
      - name: Build PRoot ARM64
        run: ./scripts/build-proot-arm64.sh
      - name: Run Unit Tests and Build APKs
        run: ./gradlew :app:testDebugUnitTest assembleDebug assembleRelease
